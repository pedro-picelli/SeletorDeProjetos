<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seletor de projetos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-image: linear-gradient(135deg, #50687a, #597487, #638194, #6c8da1, #769aae, #769aae, #769aae, #769aae, #6c8da1, #638194, #597487, #50687a);
        }

        nav {
            background: #65c7ef10 !important;
            border-bottom: 1px solid #0000004f;
        }

        nav a, footer a {
            background-image: linear-gradient(to right, #c4cfd6, #cbd5db, #d2dadf, #d9e0e4, #e0e6e9, #e2e7ea, #e4e8ea, #e6e9eb, #e3e5e7, #e1e1e3, #dddede, #dadada) !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent;
        }

        nav a:hover, footer a:hover {
            background-image: none;
            -webkit-text-fill-color: rgb(184, 234, 235);
        }

        hr {
            border-color: #50687a;
            opacity: .5;
            width: 100%;
        }

        .light-text {
            background: linear-gradient(90deg,
                    #fff 0%,
                    #fff 40%,
                    #639cc9 50%,
                    #fff 60%,
                    #fff 100%);

            background-size: 200% 100%;
            background-position: 100% 0;

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: lightAnimation 2s linear infinite;
        }

        @keyframes lightAnimation {
            from {
                background-position: 100% 0;
            }

            to {
                background-position: -100% 0;
            }
        }



        main {
            margin-bottom: 40px;
        }

        footer {
            background: #65c7ef10 !important;
            border-top: 1px solid #0000004f;
        }
    </style>
</head>

<body>


    <div class="container-fluid d-flex flex-column" style="min-height: 100vh;">

        <header>
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Projetos</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="#">Em desenvolvimento</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>



        <main>
            <section class="mt-5 d-flex flex-column align-items-center">

                <h1>Aplicações Desenvolvidas com:</h1>
                <div class="d-flex">
                    <div class="d-flex flex-column align-items-center">
                        <img class="img-fluid" width="128" height="128"
                            src="https://img.icons8.com/nolan/128/html-5.png" alt="html-5" />
                        <span class="light-text">HTML5</span>
                    </div>
                    <div class="d-flex flex-column align-items-center">
                        <img class="img-fluid" width="128" height="128" src="https://img.icons8.com/nolan/128/css3.png"
                            alt="css3" />
                        <span class="light-text">CSS3</span>
                    </div>
                    <div class="d-flex flex-column align-items-center">
                        <img class="img-fluid" width="128" height="128" src="https://img.icons8.com/nolan/128/bootstrap.png" alt="bootstrap"/>
                        <span class="light-text">BOOTSTRAP</span>
                    </div>
                </div>


                <hr class="mb-5 mt-5">
                

                <div class="row">
                    <div class="col d-flex flex-wrap justify-content-center gap-3">
                        <!-- Primeiro Card -->
                        <div class="card" style="max-width: 18rem; width: 100%;">
                            <img src="./images/projeto1.jpg" class="card-img-top" alt="...">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">Projeto 1</h5>
                                <p class="card-text"></p>
                                <a href="./projetos/projeto1/index.html" class="btn btn-primary mt-auto" style="max-width: max-content;">Ir para o
                                    Projeto</a>
                            </div>
                        </div>

                        <!-- Segundo Card -->
                        <div class="card" style="max-width: 18rem; width: 100%;">
                            <img src="./images/projeto2.jpg" class="card-img-top" alt="...">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">Projeto 2</h5>
                                <p class="card-text"></p>
                                <a href="#" class="btn btn-primary mt-auto" style="max-width: max-content;">Ir para o
                                    Projeto</a>
                            </div>
                        </div>

                        <!-- Terceiro Card -->
                        <div class="card" style="max-width: 18rem; width: 100%;">
                            <img src="./images/projeto3.jpg" class="card-img-top" alt="...">
                            <div class="card-body d-flex flex-column" style="max-width: max-content;">
                                <h5 class="card-title">Projeto 2</h5>
                                <p class="card-text"></p>
                                <a href="#" class="btn btn-primary mt-auto" style="max-width: max-content;">Ir para o
                                    Projeto</a>
                            </div>
                        </div>
                    </div>
                </div>

            </section>

        </main>



        <footer class="mt-auto">

            <ul class="nav justify-content-center">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="#">@DEVS2026 - TODOS OS DIREITOS RESERVADOS</a>
                </li>
            </ul>

        </footer>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
